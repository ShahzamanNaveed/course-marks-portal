<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tally — Dashboard</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="student-dashboard">
<div class="app-shell student-shell">
  <aside class="sidebar student-sidebar">
    <a class="student-brand" href="/dashboard.html" aria-label="Tally dashboard">
      <span class="student-brand-mark" aria-hidden="true">T</span>
      <span><strong>Tally</strong><small>Student portal</small></span>
    </a>

    <div class="student-profile">
      <span class="student-avatar" id="student-avatar" aria-hidden="true">S</span>
      <div><strong id="student-name">Loading\u2026</strong><span class="roll" id="student-roll"></span></div>
    </div>

    <nav class="student-course-nav" aria-label="Enrolled courses">
      <div class="nav-eyebrow">Your courses</div>
      <ul class="nav-list" id="course-list"></ul>
    </nav>

    <nav class="dashboard-tools" aria-label="Student tools">
      <button type="button" data-view="notifications">Notifications <span class="nav-count" id="notification-count">0</span></button>
      <button type="button" data-view="queries">Queries</button>
    </nav>

    <button class="secondary student-signout" id="logout-btn" type="button">Sign out</button>
  </aside>
  <main class="main student-main">
    <div id="content" aria-live="polite" aria-busy="true">
      <div class="dashboard-loading" aria-label="Loading your courses">
        <div class="skeleton skeleton-title"></div>
        <div class="summary-grid">
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card"></div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="/js/student-dashboard.js"></script>
</body>
</html>
