name: Sync complete portal source

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/sync-source.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace repository with the tested source
        shell: bash
        run: |
          cat .github/workflows/source.part* | base64 --decode > /tmp/marks-portal.tar.gz
          tar -xzf /tmp/marks-portal.tar.gz -C "$GITHUB_WORKSPACE"
          rm -f .github/workflows/source.part* .github/workflows/sync-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish complete Vercel-ready portal source"
          git push
