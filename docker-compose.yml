services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: marks
      POSTGRES_USER: marks
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - marks_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marks -d marks"]
      interval: 5s
      timeout: 5s
      retries: 10

  marks-portal:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://marks:local-development-only@postgres:5432/marks
      JWT_SECRET: local-development-secret-change-before-production
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  marks_postgres_data:
